[package]
name = "drawnui-designer-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "DrawnUI Designer in-app agent for DrawnUI for Rust apps: connects a debug build to the designer hub, or a browser app to its page."

[dependencies]
# The designer API (`Tree::props`, `Tree::set_prop`, `Tree::drawn_rect`, `Ui::hit_test_visual`) is
# behind the feature `designer`; it is turned on here, so an app adds only this crate.
drawnui = { version = "0.1.0-preview.31", features = ["designer"] }
designer-protocol = { path = "../../crates/designer-protocol" }
serde_json = "1"

# The hub's WebSocket on the desktop; in the browser the page carries the messages (src/page.rs).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# Tests: the app state saved and restored through the wrapper, as the browser's hot reload does.
[dev-dependencies]
drawnui = { version = "0.1.0-preview.31", features = ["designer", "hot-reload"] }
serde = { version = "1", features = ["derive"] }

# Its own workspace, out of the ToolBox root one: the root's drawnui pin (designer-desktop) does not move.
[workspace]
members = ["sample"]


[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

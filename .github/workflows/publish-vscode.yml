# Publishes the DrawnUI Designer extension to the Visual Studio Marketplace (publisher drawnui) from the
# .vsix attached to a GitHub release, with the Marketplace's Trusted Publishing: GitHub's OIDC token is
# exchanged for a short-lived Marketplace credential, no token is stored in the repository.
#
# Runs when a release with a .vsix asset is published, or by hand for a release tag. A pre-release
# (the release's pre-release flag, or the input) must be packaged as one: `npm run package -- --pre-release`.
name: Publish VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose .vsix asset is published
        required: true
        type: string
      prerelease:
        description: Publish as a pre-release (the .vsix must be packaged with --pre-release)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # A release without a .vsix has nothing to publish.
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.release.assets.*.name, ' '), '.vsix')
    runs-on: ubuntu-latest
    steps:
      - name: Download the release's .vsix
        id: vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Every .vsix of the release: one package per platform (win32-x64, win32-arm64, darwin-arm64,
          # darwin-x64), each carrying its own designer hub; the Marketplace gives each user theirs.
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".vsix"))] | length')
          if [ "$count" = "0" ]; then
            echo "::error::Release $TAG has no .vsix asset"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.vsix" --dir vsix
          echo "paths=$(ls vsix/*.vsix | xargs)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish with trusted publishing
        env:
          VSIX: ${{ steps.vsix.outputs.paths }}
          PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          # one publish, every package: vsce takes several package paths
          npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath $VSIX $flags
